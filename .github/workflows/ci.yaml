name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
   client-fmt:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v7
          
        - name: Setup mise
          uses:  jdx/mise-action@v4

        - name: Install dependencies
          run: mise exec -- pnpm --dir client install --frozen-lockfile
        
        - name: Format check
          run: mise exec -- pnpm --dir client run fmt:check
