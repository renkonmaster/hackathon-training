services:
  mysql:
    image: mysql:8.4
    container_name: training-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: training-adminer
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"

  server:
    profiles: ["server", "fullstack"]
    build:
      context: .
      dockerfile: Dockerfile
      target: server-dev
    container_name: training-server
    working_dir: /workspace/server
    command: ["air", "-c", ".air.toml"]
    environment:
      API_ADDR: ":8080"
      DB_DSN: app:app@tcp(mysql:3306)/app?parseTime=true&multiStatements=true
      AUTH_MODE: SOFT
      ASSETS_DIR: ""
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
      - go_mod_cache:/go/pkg/mod
      - server_tmp:/workspace/server/tmp

  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client-dev
    container_name: training-client
    working_dir: /workspace/client
    environment:
      VITE_API_BASE: http://localhost:4010
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm run codegen && pnpm dev --host 0.0.0.0",
      ]
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - client_node_modules:/workspace/client/node_modules

  client-fullstack:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client-dev
    container_name: training-client
    working_dir: /workspace/client
    environment:
      VITE_API_BASE: http://localhost:8080
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm run codegen && pnpm dev --host 0.0.0.0",
      ]
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - client_node_modules:/workspace/client/node_modules

volumes:
  mysql_data:
  go_mod_cache:
  server_tmp:
  client_node_modules:
